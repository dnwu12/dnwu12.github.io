<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>DNWU | PROJECTS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="crt">
    <nav class="nav-bar">
        <a href="index.html" class="nav-logo"><img src="home.jpeg"></a>
        <ul class="nav-links">
            <li><a href="index.html">HOME</a></li>
            <li><a href="about.html">ABOUT</a></li>
            <li><a href="projects.html" class="active">PROJECTS</a></li>
            <li><a href="gallery.html">GALLERY</a></li>
            <li><a href="blog.html">BLOG</a></li>
        </ul>
    </nav>

    <main class="container">
        <h2 class="section-title">Projects</h2>
        <div id="repo-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;">
            <!-- GitHub API data will be injected here -->
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        // GitHub API 연동
        const USER = '3289david'; 
        fetch(`https://api.github.com/users/${USER}/repos?sort=updated`)
            .then(res => res.json())
            .then(data => {
                const grid = document.getElementById('repo-grid');
                data.slice(0, 6).forEach(repo => {
                    grid.innerHTML += `
                        <div class="glass-card" style="padding: 25px;">
                            <h4 style="color: var(--ice); font-family: 'Orbitron';">${repo.name}</h4>
                            <p style="font-size: 0.8rem; color: #888; margin: 10px 0;">${repo.description || 'No description'}</p>
                            <div style="font-size: 12px; color: var(--fire);">★ ${repo.stargazers_count} | ${repo.language}</div>
                            <a href="${repo.html_url}" target="_blank" style="display: inline-block; margin-top: 15px; color: #fff; text-decoration: none; border: 1px solid #444; padding: 5px 10px; border-radius: 5px;">ENTER</a>
                        </div>
                    `;
                });
            });
    </script>
</body>
</html>
